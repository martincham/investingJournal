    unit: millions_of_units
    source: https://www.trendforce.com/research/download/RP261102UN
    confidence: low
    notes: >
      CPU-heavy servers bought for agentic AI (orchestration, tool calls, sandboxes), on
      top of the traditional fleet in demand_conventional.yaml. TrendForce (2026-11-02):
      global server shipments up nearly 20% in both 2026 and 2027, server CPUs +31% and
      >+40%, the CPU:accelerator ratio moving from 1:8 toward 1:2. Traditional servers
      grow ~4%, so this is set to take total general-purpose servers to about +14%/yr in
      2026-27 (the 20% headline includes AI servers). Out-years track accelerator growth.
