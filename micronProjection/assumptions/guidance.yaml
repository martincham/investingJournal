# Company guidance. The third state between reported and projected.
#
#   reported (<= FQ4'26, calendar 2026Q3)  ->  guided (FQ1'27, 2026Q4)  ->  projected
#
# Guidance is NOT reported data and is marked separately everywhere: `is_actual` stays
# false for the guided quarter, and the report shows it as its own state. It CALIBRATES
# the first projected quarter; it never overrides an actual.
#
# GAAP, not non-GAAP. Every reported row in this model is Micron's GAAP filing (EDGAR),
# so the guided quarter is pinned to the GAAP guide or the seam would jump by the
# stock-comp adjustment. Non-GAAP equivalents are in data/reported/guidance.csv, and
# tests/test_guidance.py holds this file to that one.
#
# Source for everything below: Micron FQ4'26 press release and prepared remarks,
# 2026-09-30 (data/filings/FY26Q4/, gitignored; figures in data/reported/guidance.csv).
#
# November 2026 revision: FQ4'26 is now REPORTED ($54.2bn against a $50bn guide), so its
# guide and the "+17%/quarter contract price" consensus that bridged to FQ1'27 are gone.

guidance_end:
  value: 2026Q4
  unit: quarter
  source: USER_INPUT
  confidence: high
  notes: >
    Last CALENDAR quarter carrying a full guide: 2026Q4 = Micron's fiscal Q1 2027
    (Sep 4 - Dec 3, 2026). Must be exactly asp.pin_end + 1; the model supports one
    guided quarter. After it, price comes from asp.price_source.

revenue_usd_bn:
  value:
    central: 61.5
    tight: 63.0
    loose: 60.0
  unit: billions_usd
  source: https://www.sec.gov/Archives/edgar/data/0000723125/000072312526000018/a2026q4ex991-pressrelease.htm
  confidence: high
  notes: >
    FQ1'27 revenue guide, $61.5bn +/- $1.5bn (GAAP = non-GAAP). Central is the MIDPOINT.
    tight/loose take the ends of the range; at one quarter out upstream's bit scenarios
    barely diverge, so the near-term spread is the guide's own range, not supply.

    NOT nudged for Micron's beat record, though the record is real: FQ3'26 came in 24%
    above its guide midpoint and FQ4'26 8.5% above (data/reported/guidance.csv). The July
    file put central above the guide on that basis; this one doesn't, because a guide
    calibrates the projection and a beat is an observation we only get in December.
    Treat the beat history as upside to the central case, not as part of it.

gross_margin:
  value: 0.8595
  unit: fraction
  source: https://www.sec.gov/Archives/edgar/data/0000723125/000072312526000018/a2026q4ex991-pressrelease.htm
  confidence: high
  notes: >
    GAAP gross margin guide, ~85.95% (non-GAAP 86.25%; the 30bp is stock comp in COGS).
    Pins the guided quarter's COGS, and through it the cash cost per bit that the cost
    curve compounds forward from (model/pnl.py). Micron called FQ1 the FY27 gross-margin
    FLOOR: higher-cost FQ4 inventory (FY26 incentive comp absorbed into inventory) sells
    through in FQ1, and FQ2's relief from that is offset by higher FY27 incentive comp.
    So the anchor cost is not a one-off to be stripped out -- it is the cost level Micron
    says carries forward.

opex_usd_bn:
  value: 2.31
  unit: billions_usd
  source: https://www.sec.gov/Archives/edgar/data/0000723125/000072312526000018/a2026q4ex991-pressrelease.htm
  confidence: high
  notes: >
    GAAP operating expenses guide, ~$2.31bn (non-GAAP $2.06bn). Applied to R&D + SG&A in
    the guided quarter, split in the ratio of the opex.yaml series.

tax_rate:
  value: 0.155
  unit: fraction_of_pretax_income
  source: https://investors.micron.com/files/doc_financials/2026/q4/Q4-FY26-Prepared-Remarks.pdf
  confidence: high
  notes: >
    "Fiscal Q1 and fiscal year 2027 tax rate of around 15.5%." Applied to the guided
    quarter; opex.yaml's tax_rate series carries the same value for FY27.

eps_diluted:
  value:
    central: 37.84
    low: 36.84
    high: 38.84
  unit: usd_per_share
  source: https://www.sec.gov/Archives/edgar/data/0000723125/000072312526000018/a2026q4ex991-pressrelease.htm
  confidence: high
  notes: >
    GAAP EPS guide, $37.84 +/- $1.00 (non-GAAP $38.15). NOT an input: nothing in the
    model reads it to set a number. It is the check -- revenue, margin, opex and tax are
    pinned, and other income, D&A and the share count come from the model, so EPS landing
    inside this range tests the parts that are not pinned. tests/test_guidance.py.

capex_net_usd_bn_by_quarter:
  value: {2026Q4: 11.5, 2027Q1: 13.5, 2027Q2: 14.0, 2027Q3: 16.0}
  unit: billions_usd_per_quarter
  source: https://investors.micron.com/files/doc_financials/2026/q4/Q4-FY26-Prepared-Remarks.pdf
  confidence: medium
  notes: >
    FY27 capex, NET of government incentives (Micron's definition). Stated: FQ1 ~$11.5bn,
    first half ~$25bn, "higher in the second half". The FQ2-FQ4 split is ours: H1 - FQ1
    = $13.5bn, then $30bn over H2 rising through it, for ~$55bn in the year (double FY26's
    $27.4bn). The model's capex line is GROSS (EDGAR's PaymentsToAcquirePropertyPlant...),
    so capital.capex_incentives_usd_bn_per_quarter is added back. After FY27,
    opex.capex_intensity takes over.
